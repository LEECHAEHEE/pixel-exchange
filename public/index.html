<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도트 객장</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage" class="stage" data-map="exchange">
    <canvas id="scene" width="320" height="180"></canvas>

    <!-- 전광판은 텍스트가 잦게 바뀌므로 캔버스가 아니라 DOM 오버레이로 둔다 -->
    <div class="sign">도트증권 객장</div>
    <section id="board" class="board" aria-label="시세 전광판">
      <aside class="board-side">
        <div class="side-clock">
          <span class="clock" id="board-clock">--:--:--</span>
          <span class="date-row"><span class="date" id="board-date"></span><span class="status" id="board-status">시세 대기</span></span>
        </div>
        <div class="indices" id="board-indices"></div>
      </aside>
      <div class="board-grid" id="board-grid"></div>
      <footer class="board-ticker"><div class="ticker-track" id="board-ticker"></div></footer>
    </section>
  </main>

  <div class="bar">
    <form class="chat" id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Enter 를 눌러 채팅" aria-label="채팅 입력">
    </form>
    <span class="online" id="online" data-state="connecting">연결 중</span>
    <p class="hint" id="hint">[Esc] 조작 방법</p>
  </div>

  <!-- 입장 화면: 닉네임만 받는다. 외형은 서버가 정한다. -->
  <div class="join" id="join">
    <form class="join-box" id="join-form" autocomplete="off">
      <h1>도트증권 객장</h1>
      <label for="join-name">닉네임</label>
      <input id="join-name" type="text" maxlength="12" placeholder="12자 이내 (비우면 자동)">
      <button type="submit">입장</button>
    </form>
  </div>

  <!-- X 키로 켜고 끄는 가림 화면 -->
  <div class="cover" id="cover" hidden>[화면 가리기]</div>

  <script src="js/config.js"></script>
  <script src="js/help.js"></script>
  <script src="js/board.js"></script>
  <script src="js/items.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/places.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/race.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/emote.js"></script>
  <script src="js/net.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
